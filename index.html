<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE3">
<meta name="description" content="Morsel — a private daily journal for calories and macros.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Morsel">
<meta name="format-detection" content="telephone=no">
<title>Morsel — Calorie & Macro Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ base ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#F5EFE3; --card:#FCF8EE; --ink:#231F17; --ink-soft:#6E6555;
  --line:rgba(35,31,23,.14); --dark:#221D14; --cream:#F5EFE3;
  --outside:#E9E1CE; --field:#FFFDF6; --tint:rgba(35,31,23,.07); --faint:rgba(35,31,23,.32);
  --accent:#E0481C; --amber:#EFA63C; --olive:#7E8F4C;
  --p:#E0481C; --c:#EFA63C; --f:#7E8F4C;
  --pt:#C43D12; --ct:#9A6B10; --ft:#5C6E2C;
  --hero-bg:#221D14; --hero-fg:#F5EFE3; --hero-dim:rgba(245,239,227,.5); --hero-track:rgba(245,239,227,.13);
  --hp:#FF8A5C; --hc:#FFC46B; --hf:#B4C77E;
  --wbar:#DACDB0; --wline:rgba(35,31,23,.32); --drop-off:#C7BCA2;
  --handle:rgba(35,31,23,.2);
  --onboard:#FBEDDF; --hint:#FBF6E9;
  --danger:#B92E10; --toast-act:#FF9E7A;
  --r-lg:22px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --paper:#161310; --card:#1F1B14; --ink:#EAE2CF; --ink-soft:#9C9179;
  --line:rgba(234,226,207,.13); --dark:#0E0C09; --cream:#161310;
  --outside:#0D0B08; --field:#2A2519; --tint:rgba(234,226,207,.08); --faint:rgba(234,226,207,.42);
  --pt:#FF8A5C; --ct:#FFC46B; --ft:#B4C77E;
  --hero-bg:#EDE5D2; --hero-fg:#231F17; --hero-dim:rgba(35,31,23,.55); --hero-track:rgba(35,31,23,.12);
  --hp:#C43D12; --hc:#9A6B10; --hf:#5C6E2C;
  --wbar:#4E4732; --wline:rgba(234,226,207,.3); --drop-off:#57503E;
  --handle:rgba(234,226,207,.28);
  --onboard:#292117; --hint:#242017;
  --danger:#FF8A63; --toast-act:#C43D12;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
body{font-family:Karla,system-ui,sans-serif;background:var(--outside);color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;touch-action:manipulation}
button{font-family:Karla,sans-serif;cursor:pointer;color:inherit}
input,select,button{font-family:Karla,sans-serif}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--amber);color:var(--ink)}
::placeholder{color:var(--ink-soft);opacity:.75}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);
  display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line)}
@media(max-width:521px){#app{border:none}}
main{flex:1;padding:14px 16px calc(126px + env(safe-area-inset-bottom))}
.page{display:none;min-height:60vh}
.page.on{display:block;animation:pageIn .28s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--ink-soft);
  text-transform:uppercase;font-weight:700}
.tiny{font-size:12.5px;line-height:1.55;color:var(--ink-soft)}
.dim{opacity:.65}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin:8px 2px 8px}
.ph-r{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.08em;color:var(--ink-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;
  margin-bottom:14px;box-shadow:0 1px 2px rgba(35,31,23,.04),0 10px 28px -16px rgba(35,31,23,.2)}
.mp{color:var(--pt);font-weight:700}.mc{color:var(--ct);font-weight:700}.mf{color:var(--ft);font-weight:700}

/* ============ top bar ============ */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);display:flex;align-items:center;
  justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
  border-bottom:1px solid var(--line)}
.brand{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:800;font-size:23px;
  letter-spacing:-.015em;display:inline-flex;align-items:center}
.bglyph{width:.6em;height:.6em;margin:0 .05em;transform:translateY(.03em)}
.top-actions{display:flex;align-items:center;gap:12px}
.topdate{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:var(--ink-soft)}
.cambtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);display:grid;place-items:center;flex:none;transition:transform .12s}
.cambtn:active{transform:scale(.9)}

/* ============ date bar ============ */
.datebar{margin-bottom:14px}
.dmonth{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;padding:0 2px}
.dmonth h2{font-family:Fraunces,serif;font-size:20px;font-weight:700;letter-spacing:-.01em}
.todaybtn{background:var(--ink);color:var(--cream);border:none;border-radius:999px;padding:6px 13px;
  font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.12em}
.drow{display:flex;align-items:center;gap:6px}
.darrow{width:34px;height:44px;border:none;background:none;color:var(--ink-soft);
  display:grid;place-items:center;flex:none;border-radius:12px}
.darrow:active{background:var(--tint)}
.drail{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1}
.dcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;
  border-radius:14px;border:none;background:none}
.dcell .dw{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.08em;color:var(--ink-soft)}
.dcell .dn{font-weight:700;font-size:15px;line-height:1.1}
.dcell .ddot{width:4px;height:4px;border-radius:50%;background:transparent}
.dcell.has .ddot{background:var(--amber)}
.dcell.on{background:var(--ink);color:var(--cream)}
.dcell.on .dw{color:var(--cream);opacity:.62}
.dcell.on.has .ddot{background:var(--amber)}
.dcell.tdy:not(.on) .dn{color:var(--accent)}

/* ============ hero ============ */
.hero{background:var(--hero-bg);border-radius:24px;padding:16px 16px 18px;color:var(--hero-fg);
  margin-bottom:14px;box-shadow:0 14px 34px -18px rgba(35,31,23,.55)}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.hero-top .eyebrow{color:var(--hero-dim)}
.hero-pct{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.14em;
  color:var(--hero-dim)}
.hgrid{display:grid;grid-template-columns:168px 1fr;gap:16px;align-items:center}
@media(max-width:374px){.hgrid{grid-template-columns:150px 1fr}}
.heroring{width:100%;display:block}
.htrack{stroke:var(--hero-track)}
#hSegP{stroke:var(--p)}#hSegC{stroke:var(--c)}#hSegF{stroke:var(--f)}
#hNum{font-family:Fraunces,serif;font-weight:800;font-size:36px;letter-spacing:-.02em;fill:var(--hero-fg)}
#hNum.warn{fill:var(--amber)}
#hNum.over{fill:#F26B3C}
#hLbl{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.2em;fill:var(--hero-dim)}
.hside{display:flex;flex-direction:column;gap:12px}
.mrow .lbl{display:flex;justify-content:space-between;align-items:center;
  font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.12em;color:var(--hero-dim);margin-bottom:5px}
.mrow .lbl span{display:flex;align-items:center;gap:6px}
.mrow .lbl i{width:8px;height:8px;border-radius:3px;display:inline-block}
.mrow .lbl b{font-family:Karla;font-weight:700;font-size:12.5px;color:var(--hero-fg);letter-spacing:0}
.mrow .lbl b.over{color:#F26B3C}
.mtrack{height:6px;border-radius:4px;background:var(--hero-track);overflow:hidden}
.mfill{height:100%;border-radius:4px;transition:width .5s ease}

/* ============ meals ============ */
.meals{padding:8px 16px}
.meal{padding:12px 0 8px;border-top:1px solid var(--line)}
.meal:first-child{border-top:none;padding-top:8px}
.meal-head{display:flex;align-items:center;gap:10px}
.meal-head .eyebrow{flex:1}
.mkc{font-family:Fraunces,serif;font-weight:600;font-size:17px}
.addbtn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);
  display:grid;place-items:center;flex:none;transition:transform .12s}
.addbtn:active{transform:scale(.88)}
.entry{display:flex;align-items:center;gap:10px;padding:11px 0 10px;border-top:1px dashed var(--line);
  margin-top:2px;cursor:pointer}
.entry .info{flex:1;min-width:0}
.ename{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esub{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-top:3px}
.ekcal{font-family:Fraunces,serif;font-weight:600;font-size:16px;flex:none}
.edel{width:32px;height:32px;border:none;background:none;color:var(--faint);
  display:grid;place-items:center;flex:none}
.edel:active{color:var(--accent)}
.empty{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--ink-soft);padding:9px 0 4px}

/* ============ water & week ============ */
.wval2{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-soft)}
.drops{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.drop{width:36px;height:38px;background:none;border:none;padding:2px;color:var(--drop-off)}
.drop.filled{color:var(--ink)}
.wmore{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft)}
.w-bars{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;
  height:86px;padding-top:14px;margin-top:6px}
.wline{position:absolute;left:0;right:0;border-top:2px dashed var(--wline);pointer-events:none}
.wcell{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;
  height:100%;background:none;border:none;padding:0}
.wval{font-family:'Space Mono',monospace;font-size:8.5px;color:var(--ink-soft)}
.wbar{width:62%;background:var(--wbar);border-radius:6px 6px 3px 3px;min-height:3px;transition:height .4s ease}
.wcell.over .wbar{background:var(--accent)}
.wcell.on .wbar{outline:2px solid var(--ink);outline-offset:1px}
.w-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px;text-align:center}
.wday{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.04em;color:var(--ink-soft)}
.wday.tdy{color:var(--accent);font-weight:700}
.wday.on{color:var(--ink);font-weight:700}

/* ============ tab bar & fab ============ */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  background:var(--paper);border-top:1px solid var(--line);z-index:30;
  display:grid;grid-template-columns:1fr 1fr 86px 1fr 1fr;align-items:center;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 5px;background:none;
  border:none;color:var(--ink-soft);font-family:'Space Mono',monospace;font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--accent)}
.fab-slot{display:grid;place-items:center}
.fab{width:58px;height:58px;border-radius:50%;background:var(--accent);color:#FFF6E9;border:none;
  display:grid;place-items:center;margin-top:-36px;transition:transform .12s;
  box-shadow:0 0 0 4px var(--paper),0 8px 20px -6px rgba(224,72,28,.6)}
.fab:active{transform:scale(.9)}

/* ============ cards / controls ============ */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.inp{height:46px;border:1.5px solid var(--ink);border-radius:12px;background:var(--field);padding:0 12px;
  font-size:16px;font-weight:600;color:var(--ink);width:100%;min-width:0}
.hint{font-size:11px;color:var(--ink-soft)}
.selwrap{position:relative}
.selwrap::after{content:'';position:absolute;right:15px;top:50%;width:8px;height:8px;
  border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);
  transform:translateY(-70%) rotate(45deg);pointer-events:none}
select.inp{appearance:none;-webkit-appearance:none;padding-right:36px;font-size:15px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--tint);
  padding:4px;border-radius:12px}
.seg button{padding:9px 4px;border:none;background:none;border-radius:9px;font-weight:700;
  font-size:12.5px;color:var(--ink-soft)}
.seg button.on{background:var(--field);color:var(--ink);box-shadow:0 1px 3px rgba(35,31,23,.14)}
.seg-sm button{padding:7px 10px;font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;width:100%;
  border-radius:14px;font-weight:700;font-size:15px;border:none}
.btn.primary{background:var(--accent);color:#FFF7EC;box-shadow:0 5px 16px -5px rgba(224,72,28,.55)}
.btn.primary:active{transform:scale(.98)}
.btn.ghost{background:none;border:1.5px solid var(--ink);color:var(--ink)}
.btn.danger{background:none;border:1.5px solid rgba(192,53,29,.45);color:var(--danger)}
.btn-sm{height:38px;padding:0 16px;border-radius:12px;font-weight:700;font-size:13px;border:none;width:auto}
.btn-sm.primary{background:var(--accent);color:#FFF7EC}
.rcards{display:flex;flex-direction:column;gap:8px}
.rcard{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:14px;background:var(--card);text-align:left}
.rcard.on{border-color:var(--ink);background:var(--field)}
.rcard .rt{flex:1;min-width:0}
.rcard .rt b{font-size:15px}
.rcard .rt span{display:block;font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-soft);margin-top:3px}
.rkcal{font-family:Fraunces,serif;font-weight:700;font-size:17px;flex:none}
.rcheck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;
  place-items:center;color:#FFF7EC;flex:none}
.rcard.on .rcheck{background:var(--accent);border-color:var(--accent)}
.searchbar{display:flex;align-items:center;gap:9px;border:1.5px solid var(--ink);border-radius:14px;
  padding:0 12px;background:var(--field);color:var(--ink-soft)}
.searchbar:focus-within{box-shadow:0 0 0 3px rgba(224,72,28,.14)}
.searchbar input{flex:1;border:none;background:none;font-weight:600;font-size:16px;height:46px;outline:none;color:var(--ink);min-width:0}
.clearq{border:none;background:none;color:var(--ink-soft);display:grid;place-items:center;padding:4px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 2px 12px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-weight:700;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.frowwrap{display:flex;gap:4px;align-items:center;border-top:1px solid var(--line)}
.frow{flex:1;min-width:0;border:none;background:none;text-align:left;padding:11px 2px;
  display:flex;align-items:center;gap:10px}
.frow .info{flex:1;min-width:0}
.fname{font-weight:700;font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta{font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-soft);margin-top:3px;display:block}
.frow svg{color:var(--ink-soft);flex:none}
.fmini{width:34px;height:34px;border:none;background:none;color:var(--ink-soft);
  display:grid;place-items:center;flex:none}
.fmini:active{color:var(--accent)}
.list-title{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:var(--ink-soft);
  margin:12px 2px 2px;text-transform:uppercase}
.empty-big{padding:28px 12px;text-align:center;color:var(--ink-soft);font-size:13.5px;line-height:1.6}

/* ============ plan ============ */
#segP{fill:var(--p)}#segC{fill:var(--c)}#segF{fill:var(--f)}
.piewrap{display:grid;place-items:center;padding:6px 0 2px}
.piewrap svg{width:min(235px,80vw);height:auto;touch-action:none}
.phandle{cursor:grab}
.phandle:active{cursor:grabbing}
.phandle>circle:first-child{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
.hdot{fill:var(--ink)}
.pk{font-family:Fraunces,serif;font-weight:800;font-size:33px;fill:var(--ink)}
.pl{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.18em;fill:var(--ink-soft)}
.plegend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:8px;
  font-family:'Space Mono',monospace;font-size:10px;font-weight:700}
.plegend span{display:flex;align-items:center;gap:6px}
.plegend i{width:9px;height:9px;border-radius:3px}
.bignum{display:flex;align-items:baseline;gap:10px;margin:2px 0 6px}
.bignum span{font-family:Fraunces,serif;font-weight:800;font-size:46px;letter-spacing:-.02em}
.bignum em{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.14em;
  color:var(--ink-soft);font-style:normal}
.rrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
  border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink-soft)}
.rrow b{color:var(--ink);font-size:15px}
.mtr{display:grid;grid-template-columns:12px 1fr 68px 80px 38px;align-items:center;gap:8px;
  padding:10px 0;border-top:1px dashed var(--line)}
.mtr i{width:10px;height:10px;border-radius:3px}
.mtr span{font-weight:700;font-size:13.5px}
.mtr b{font-family:Fraunces,serif;font-size:15px}
.mtr em{font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-soft);font-style:normal}
.mtr small{font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-soft);text-align:right}
.note{margin-top:10px;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft)}

/* ============ settings ============ */
.setrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px dashed var(--line)}
.setrow:first-child{border-top:none;padding-top:4px}
.seticon{width:36px;height:36px;border-radius:12px;background:var(--tint);
  display:grid;place-items:center;color:var(--ink-soft);flex:none}
.setlab{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.setlab b{font-size:14.5px}
.setlab span{font-size:11.5px;color:var(--ink-soft)}
.stepv{display:flex;align-items:center;gap:4px;background:var(--tint);border-radius:12px;padding:4px;flex:none}
.stepv button{width:32px;height:32px;border:none;background:var(--field);border-radius:9px;
  display:grid;place-items:center;box-shadow:0 1px 2px rgba(35,31,23,.15)}
.stepv b{width:32px;text-align:center;font-size:15px}
.installok{display:flex;gap:10px;align-items:center}
.installok svg{color:var(--olive);flex:none}
.installok b{display:block}
.installok span{font-size:12.5px;color:var(--ink-soft)}
.steps{margin:10px 0 2px 18px;font-size:13.5px;display:flex;flex-direction:column;gap:9px}
.steps svg{vertical-align:-3px}

/* ============ onboarding / hint ============ */
.onboard{border:1.5px solid var(--ink);background:var(--onboard);border-radius:20px;padding:18px;
  margin-bottom:14px;box-shadow:3px 3px 0 rgba(35,31,23,.12)}
.onboard h3{font-family:Fraunces,serif;font-weight:800;font-size:24px;letter-spacing:-.01em}
.onboard p{margin:8px 0 14px;font-size:14px;line-height:1.5;color:var(--ink-soft)}
.orow{display:flex;gap:10px}
.orow .btn{flex:1;height:44px;font-size:14px}
.hintcard{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--ink);border-radius:16px;
  padding:12px 14px;margin-bottom:14px;background:var(--hint)}
.hintcard>svg{flex:none;color:var(--ink)}
.hintcard p{flex:1;font-weight:600;font-size:13.5px;line-height:1.35}
.hintx{background:none;border:none;color:var(--ink-soft);padding:6px}

/* ============ sheets ============ */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  pointer-events:none}
.sheet-wrap.on{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(28,23,14,.55);opacity:0;transition:opacity .3s}
.on .backdrop{opacity:1}
.sheet{position:relative;width:100%;max-width:520px;background:var(--card);border-radius:26px 26px 0 0;
  transform:translateY(105%);transition:transform .34s cubic-bezier(.32,.72,.25,1);
  display:flex;flex-direction:column;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.sheet.tall{height:min(700px,90dvh)}
.sheet.sm{height:auto;max-height:86dvh}
.on .sheet{transform:none}
.sheet.dragging{transition:none}
.handle-area{padding:9px 0 5px;display:flex;justify-content:center;flex:none;touch-action:none;cursor:grab}
.sheet-handle{width:44px;height:5px;border-radius:3px;background:var(--handle)}
.panes{display:flex;width:300%;flex:1;min-height:0;transition:transform .32s cubic-bezier(.32,.72,.25,1)}
.pane{width:calc(100%/3);display:flex;flex-direction:column;min-height:0;padding:0 16px 6px}
.plist{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.pbody{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.sm-body{padding:2px 20px 10px;overflow-y:auto;max-height:70vh}
.shead{display:flex;align-items:center;gap:10px;padding:8px 0 12px;flex:none}
.shead h3{font-family:Fraunces,serif;font-weight:700;font-size:20px;flex:1;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbtn{width:36px;height:36px;border-radius:50%;border:none;background:var(--tint);
  display:grid;place-items:center;flex:none}
.sh3{font-family:Fraunces,serif;font-weight:700;font-size:21px;margin:6px 0 8px}
.sp{font-size:14px;line-height:1.55;color:var(--ink-soft);margin-bottom:16px}
.dcat{margin-top:2px}
.dcard{background:var(--paper);border-radius:16px;padding:12px 14px;margin-top:12px}
.amtc{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.stp{width:44px;border-radius:12px;border:1.5px solid var(--ink);background:var(--field);
  display:grid;place-items:center;flex:none}
.amtin{flex:1;border:1.5px solid var(--ink);border-radius:12px;background:var(--field);text-align:center;
  font-weight:700;font-size:17px;min-width:0}
.unitc{width:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
  font-family:'Space Mono',monospace;font-weight:700;font-size:12px;color:var(--ink-soft);flex:none}
.schips{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.dlive{display:flex;align-items:center;gap:16px;background:var(--hero-bg);border-radius:16px;
  padding:14px 16px;margin-top:12px;color:var(--hero-fg)}
.dk{display:flex;flex-direction:column;flex:none}
.dk span{font-family:Fraunces,serif;font-weight:800;font-size:30px;line-height:1}
.dk em{font-family:'Space Mono',monospace;font-weight:700;font-size:9px;letter-spacing:.14em;
  color:var(--hero-dim);font-style:normal;margin-top:4px}
.dm{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dm>div{display:flex;flex-direction:column;align-items:center;gap:2px}
.dm b{font-size:15px}
.dm em{font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;
  color:var(--hero-dim);font-style:normal}
.dlive .mp{color:var(--hp)}.dlive .mc{color:var(--hc)}.dlive .mf{color:var(--hf)}
.elive{font-weight:600;font-size:14px;display:flex;justify-content:center;gap:12px;margin-top:12px;
  background:var(--paper);border-radius:12px;padding:10px}
.elive b{font-family:Fraunces,serif;font-size:15px}

/* ============ AI scanner ============ */
.scanbanner{display:flex;align-items:center;gap:10px;width:100%;border:1.5px dashed var(--ink);
  background:var(--hint);border-radius:14px;padding:11px 12px;margin:2px 0 10px;text-align:left}
.scanbanner>svg:first-child{color:var(--accent);flex:none}
.scanbanner .sb-txt{flex:1;min-width:0}
.scanbanner .sb-txt b{display:block;font-size:13.5px;text-align:left}
.scanbanner .sb-txt span{display:block;font-size:11px;color:var(--ink-soft);margin-top:1px;text-align:left}
.scanbanner>svg:last-child{color:var(--ink-soft);flex:none}
.scan-spin{width:44px;height:44px;margin:6px auto 10px;border-radius:50%;
  border:3px solid var(--tint);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-thumb{display:block;width:100%;max-height:180px;object-fit:cover;border-radius:14px;
  margin:12px 0 2px;border:1px solid var(--line)}
.failicon{width:46px;height:46px;margin:2px auto 0;border-radius:50%;background:var(--tint);
  color:var(--ink-soft);display:grid;place-items:center}
.scanerr{text-align:center;padding:4px 0 10px}
.scard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.shead-row{display:flex;gap:8px;align-items:center}
.sname{flex:1;min-width:0;border:none;border-bottom:1.5px dashed var(--line);background:none;
  font-weight:700;font-size:15px;color:var(--ink);padding:2px 0}
.sname:focus{border-bottom-color:var(--ink);outline:none}
.srctag{font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.1em;
  color:var(--ink-soft);text-transform:uppercase;flex:none}
.p100{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.p100>div{display:flex;flex-direction:column;gap:3px;align-items:center;min-width:0}
.p100 input{width:100%;height:34px;border:1.5px solid var(--line);border-radius:9px;background:var(--field);
  text-align:center;font-weight:700;font-size:13px;color:var(--ink)}
.p100 em{font-style:normal;font-family:'Space Mono',monospace;font-size:8.5px;color:var(--ink-soft)}
.p100cap{display:block;font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.08em;
  color:var(--ink-soft);margin-top:6px;text-transform:uppercase}
.saveline{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;font-weight:600;
  color:var(--ink-soft);cursor:pointer}
.saveline input{width:18px;height:18px;accent-color:var(--accent)}
.keybox{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);
  border-radius:14px;padding:11px 12px}
.keydot{width:9px;height:9px;border-radius:50%;background:var(--olive);flex:none}
.keyinfo{flex:1;min-width:0}
.keyinfo b{font-size:13.5px;display:block}
.keyinfo span{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--ink-soft)}

/* ============ toast ============ */
#toasts{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;z-index:70;pointer-events:none;padding:0 20px}
.toast{pointer-events:auto;background:var(--ink);color:var(--cream);border-radius:999px;
  padding:11px 18px;font-weight:600;font-size:13.5px;display:flex;gap:16px;align-items:center;
  box-shadow:0 10px 28px -8px rgba(35,31,23,.5);opacity:0;transform:translateY(12px);
  transition:.28s;max-width:100%}
.toast.on{opacity:1;transform:none}
.t-act{background:none;border:none;color:var(--toast-act);font-weight:700;font-size:13px;
  text-transform:uppercase;letter-spacing:.04em;padding:0}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

function mergeState(obj){

function day(k){if(!state.days[k])state.days[k]={b:[],l:[],d:[],s:[],w:0};
  const d=state.days[k];['b','l','d','s'].forEach(m=>{if(!Array.isArray(d[m]))d[m]=[];});
  if(typeof d.w!=='number')d.w=0;return d;}

/* Carbs fix: entries used to be saved as per100.c but read as per100.cb.
   cOf reads either key safely; migrateDays rewrites old entries once. */
const cOf=per=>{if(!per)return 0;const v=per.cb!==undefined?per.cb:per.c;
  return(typeof v==='number'&&isFinite(v))?v:0;};
function migrateDays(days){
  let changed=false;
  for(const k of Object.keys(days||{})){
    const d=days[k];if(!d)continue;
    for(const m of['b','l','d','s']){
      const arr=d[m];if(!Array.isArray(arr))continue;
      for(const e of arr){
        if(e&&e.per100&&e.per100.cb===undefined){
          e.per100.cb=(e.per100.c!==undefined&&isFinite(e.per100.c))?e.per100.c:0;
          if('c' in e.per100)delete e.per100.c;
          changed=true;
        }
      }
    }
  }
  return changed;
}
if(migrateDays(state.days))save();

function totals(d){const t={k:0,p:0,c:0,f:0};
  for(const m of['b','l','d','s'])for(const e of(d[m]||[])){const g=e.g/100;
    t.k+=e.per100.k*g;t.p+=e.per100.p*g;t.c+=cOf(e.per100)*g;t.f+=e.per100.f*g;}return t;}

function toast(msg,act){
  const root=$('#toasts');root.innerHTML='';
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span>${msg}</span>`+(act?`<button class="t-act">${esc(act.label)}</button>`:'');
  root.appendChild(t);
  const hide=()=>{t.classList.remove('on');setTimeout(()=>t.remove(),300);};
  if(act)t.querySelector('.t-act').onclick=()=>{act.fn();hide();};
  requestAnimationFrame(()=>t.classList.add('on'));
  clearTimeout(toastTimer);toastTimer=setTimeout(hide,act?4500:2400);

let curSheet=null;
function sheetBindDrag(w){
  const ha=w.querySelector('.handle-area'),sh=w.querySelector('.sheet');
  if(!ha||!sh)return;
  let sy=0,dy=0,dr=false;
  ha.addEventListener('pointerdown',e=>{dr=true;sy=e.clientY;sh.classList.add('dragging');ha.setPointerCapture(e.pointerId);});
  ha.addEventListener('pointermove',e=>{if(!dr)return;dy=Math.max(0,e.clientY-sy);sh.style.transform=`translateY(${dy}px)`;});
  const end=()=>{if(!dr)return;dr=false;sh.classList.remove('dragging');
    if(dy>110){sh.style.transform='translateY(105%)';w.classList.remove('on');
      setTimeout(()=>{if(curSheet===w)curSheet=null;w.remove();},380);}
    else sh.style.transform='';dy=0;};
  ha.addEventListener('pointerup',end);ha.addEventListener('pointercancel',end);
}
function openSheet(html,cls=''){
  if(curSheet)curSheet.remove();
  const w=document.createElement('div');w.className='sheet-wrap';
  w.innerHTML=`<div class="backdrop" data-act="sheet-close"></div><div class="sheet ${cls}">${html}</div>`;
  document.body.appendChild(w);curSheet=w;
  sheetBindDrag(w);
  w.offsetHeight; // force initial styles
  requestAnimationFrame(()=>w.classList.add('on'));
  return w;
}
function closeSheet(){
  if(!curSheet)return;const w=curSheet;curSheet=null;

  return`M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;}

let heroCur={sw:[0,0,0],num:null},heroRaf=null;
function drawHero(sw){
  const ids=['hSegP','hSegC','hSegF'];let a=-89;
  sw.forEach((s,i)=>{const el=document.getElementById(ids[i]);if(!el)return;
    if(s<1.2){el.setAttribute('d','');return;}
    const a1=a+s;el.setAttribute('d',arcStroke(100,100,80,a,a1));a=a1+2;});
}
function updateHero(tot,t){
  const hn=$('#hNum'),hl=$('#hLbl');if(!hn)return;
  const eaten=tot.k,pk=tot.p*4,ck=tot.c*4,fk=tot.f*9,sum=pk+ck+fk;
  const frac=clamp(eaten/t.kcal,0,1);
  const tgt=sum>0?[pk/sum*frac*354,ck/sum*frac*354,fk/sum*frac*354]:[0,0,0];
  let num,lbl,mode='',pfx='';
  if(eaten<1){num=t.kcal;lbl='KCAL BUDGET';}
  else if(t.kcal-eaten>=0){num=Math.round(t.kcal-eaten);lbl='KCAL LEFT';
    if(t.kcal-eaten<t.kcal*.15)mode='warn';}
  else{num=Math.round(eaten-t.kcal);lbl='KCAL OVER';mode='over';pfx='+';}
  hn.classList.toggle('warn',mode==='warn');
  hn.classList.toggle('over',mode==='over');
  const from={sw:[...heroCur.sw],num:heroCur.num===null?num:heroCur.num};
  heroCur={sw:tgt,num};
  const dur=REDUCED?0:700,t0=performance.now();
  cancelAnimationFrame(heroRaf);
  const step=now=>{
    const q=dur?Math.min(1,(now-t0)/dur):1,e=1-Math.pow(1-q,3);
    drawHero(from.sw.map((v,i)=>v+(tgt[i]-v)*e));
    hn.textContent=pfx+fmt(from.num+(num-from.num)*e);
    hl.textContent=lbl;
    if(q<1)heroRaf=requestAnimationFrame(step);
  };
  heroRaf=requestAnimationFrame(step);
}

function initPie(){
  const svg=document.getElementById('planPie');if(!svg)return;
  const angle=e=>{const r=svg.getBoundingClientRect();
    const x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);
    let a=Math.atan2(y,x)*180/Math.PI+90;return a<0?a+360:a;};
  let drag=-1;
  const dist=(x,y)=>Math.min(Math.abs(x-y),360-Math.abs(x-y));
  svg.addEventListener('pointerdown',e=>{
    const a=angle(e),{p,c}=state.macros,b0=p*3.6,b1=(p+c)*3.6;
    const d0=dist(a,b0),d1=dist(a,b1);
    if(Math.min(d0,d1)>16)return;
    drag=d0<=d1?0:1;svg.setPointerCapture(e.pointerId);e.preventDefault();
  });
  svg.addEventListener('pointermove',e=>{
    if(drag<0)return;
    let v=angle(e)/3.6;const{p,c,f}=state.macros;
    if(drag===0&&v>90)v-=100;      // wrap past the top
    if(drag===1&&v<10)v+=100;      // wrap past the top
    if(drag===0){const np=clamp(Math.round(v),10,100-f-10);
      if(np!==p){state.macros.p=np;state.macros.c=100-f-np;updatePlanResults();}}
    else{const nc=clamp(Math.round(v-p),10,100-p-10);
      if(nc!==c){state.macros.c=nc;state.macros.f=100-p-nc;updatePlanResults();}}
  });
  const up=()=>{if(drag>=0){drag=-1;save();buzz(6);}};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
}

/* --- image helpers --- */
function scaledDataURL(src,maxSide,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const s=Math.min(1,maxSide/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg',quality));
      }catch(e){reject(e);}
      finally{if(src&&src.startsWith('blob:'))URL.revokeObjectURL(src);}
    };
    img.onerror=()=>{if(src&&src.startsWith('blob:'))URL.revokeObjectURL(src);reject(new Error('img'));};
    img.src=src;
  });
}
function loadImgEl(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}

let zxingPromise=null;
function loadZXing(){
  if(window.ZXing)return Promise.resolve();
  if(zxingPromise)return zxingPromise;
  zxingPromise=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload=res;s.onerror=()=>{zxingPromise=null;rej(new Error('nolib'));};
    document.head.appendChild(s);
  });
  return zxingPromise;
}
async function detectBarcode(dataUrl){
  const fmts=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf','codabar'];
  if('BarcodeDetector' in window){
    try{
      let use=fmts;
      try{const sup=await BarcodeDetector.getSupportedFormats();use=fmts.filter(f=>sup.includes(f));}catch(e){}
      const det=new BarcodeDetector(use.length?{formats:use}:{});
      const img=await loadImgEl(dataUrl);
      const codes=await det.detect(img);
      if(codes&&codes.length&&codes[0].rawValue)return codes[0].rawValue.trim();
      return null;
    }catch(e){/* fall through to ZXing */}
  }
  try{
    await loadZXing();
    if(window.ZXing){
      const reader=new window.ZXing.BrowserMultiFormatReader();
      const result=await reader.decodeFromImageUrl(dataUrl);
      if(result)return String(result.getText()||'').trim();
    }
  }catch(e){}
  return null;
}

/* --- Open Food Facts lookup (free, no key, exact label data) --- */
async function offLookup(barcode){
  let res;
  try{res=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(barcode)}.json?fields=product_name,brands,nutriments,serving_quantity,serving_size`);}
  catch(e){throw new Error('offline');}
  if(res.status===404)return null;
  if(!res.ok)throw new Error('off');
  let data;try{data=await res.json();}catch(e){return null;}
  if(!data||data.status!==1||!data.product)return null;
  const p=data.product,n=p.nutriments||{};
  const num=v=>{const x=parseFloat(v);return isFinite(x)&&x>=0?x:0;};
  let k=n['energy-kcal_100g'];
  if((k===null||k===undefined||isNaN(k))&&isFinite(n['energy_100g']))k=n['energy_100g']/4.184;
  const brand=(p.brands||'').split(',')[0].trim();
  const name=[(p.product_name||'').trim(),brand].filter(Boolean).join(' — ')||('Product '+barcode);
  if(k===null||k===undefined||isNaN(k))return{noData:true,name};
  const sq=parseFloat(p.serving_quantity);
  const hasSq=isFinite(sq)&&sq>0&&sq<=2000;
  return{
    name:name.slice(0,60),
    grams:hasSq?Math.round(sq):100,
    k100:+clamp(num(k),0,1000).toFixed(1),
    p100:+clamp(num(n['proteins_100g']),0,100).toFixed(1),
    c100:+clamp(num(n['carbohydrates_100g']),0,100).toFixed(1),
    f100:+clamp(num(n['fat_100g']),0,100).toFixed(1),
    conf:null,
    serving:hasSq?{label:String(p.serving_size||Math.round(sq)+' g').slice(0,24),grams:Math.round(sq)}:null
  };
}

/* --- Gemini call with model fallback chain --- */
async function geminiFetch(body){
  if(!state.geminiKey)throw new Error('nokey');
  const models=state.geminiModel?[state.geminiModel,...GEMINI_MODELS.filter(m=>m!==state.geminiModel)]:GEMINI_MODELS;
  let modelMiss=false;
  for(const m of models){
    let res;
    try{res=await fetch(GEMINI_URL+m+':generateContent',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':state.geminiKey},
      body:JSON.stringify(body)});}
    catch(e){throw new Error('offline');}
    if(res.ok){
      if(state.geminiModel!==m){state.geminiModel=m;save();}
      return res.json();
    }
    let msg='';try{const j=await res.json();msg=(j&&j.error&&j.error.message)||'';}catch(e){}
    if(res.status===404){modelMiss=true;continue;}
    if(res.status===403)throw new Error('badkey');
    if(res.status===400)throw new Error(/api key/i.test(msg)?'badkey':'api');
    if(res.status===429)throw new Error('quota');
    throw new Error('api');
  }
  throw new Error(modelMiss?'model':'api');
}
const geminiText=data=>{const c=data&&data.candidates&&data.candidates[0];
  const parts=(c&&c.content&&c.content.parts)||[];return parts.map(p=>p.text||'').join('');};
function scanErrMsg(e){
  switch(String(e&&e.message)){
    case 'nokey':return 'Add your Gemini API key first (Settings → AI Scanner).';
    case 'offline':return 'No connection — scanning needs internet.';
    case 'badkey':return 'Your Gemini API key was rejected. Check it in Settings.';
    case 'quota':return 'Gemini quota reached — try again later.';
    case 'model':return 'AI service unavailable right now — try again soon.';
    case 'off':return 'Open Food Facts is unreachable right now.';
    default:return 'Something went wrong scanning this photo. Try again.';
  }
}
async function testGemini(){
  if(!state.geminiKey){toast('No key saved yet');return;}
  try{
    await geminiFetch({contents:[{parts:[{text:'Reply with the word OK'}]}],
      generationConfig:{temperature:0,maxOutputTokens:16}});
    toast('Key works — Gemini is responding');
  }catch(e){toast(scanErrMsg(e));}
}

function setScanStatus(t){const el=document.getElementById('scanStatus');if(el)el.textContent=t;}
async function handleScanFile(file){
  if(!file)return;
  if(!file.type||!file.type.startsWith('image/')){toast('Please choose a photo');return;}
  const my=++scanSeq.n;
  let barImg;
  try{barImg=await scaledDataURL(URL.createObjectURL(file),1600,.92);}
  catch(e){toast("Couldn't read that image");return;}
  if(my!==scanSeq.n)return;
  lastScanImg=barImg;
  openScanWorking(barImg);
  try{
    setScanStatus('Checking for barcode…');
    const bc=await detectBarcode(barImg);
    if(my!==scanSeq.n)return;
    if(bc){
      setScanStatus('Looking up product…');
      const prod=await offLookup(bc);
      if(my!==scanSeq.n)return;
      if(prod&&prod.noData){
        showScanFail(`Found “${esc(prod.name)}” in Open Food Facts, but it has no nutrition data listed. You can try a photo of the food itself.`,
          {label:'Scan as photo',fn:()=>scanAsAI()});
        return;
      }
      if(prod){showScanReview('off',[prod]);return;}
      showScanFail(`Barcode <b>${esc(bc)}</b> isn't in the free Open Food Facts database yet.`,
        {label:'Scan as photo',fn:()=>scanAsAI()});
      return;
    }
    await runAIScan(barImg,my);
  }catch(err){
    if(my!==scanSeq.n)return;
    showScanFail(scanErrMsg(err));
  }
}
function scanAsAI(){
  const my=++scanSeq.n;
  if(!lastScanImg){closeSheet();return;}
  openScanWorking(lastScanImg);
  runAIScan(lastScanImg,my).catch(err=>{if(my===scanSeq.n)showScanFail(scanErrMsg(err));});
}
async function runAIScan(imgDataUrl,my){
  if(!state.geminiKey){
    showScanFail('To analyze food photos, add your free Gemini API key.',
      {label:'Open settings',fn:()=>{closeSheet();setTab('settings');openAISettings();}});
    return;
  }
  setScanStatus('Analyzing with AI…');
  const aiImg=await scaledDataURL(imgDataUrl,800,.85);
  const b64=aiImg.split(',')[1];
  const data=await geminiFetch({
    contents:[{parts:[{text:SCAN_PROMPT},{inlineData:{mimeType:'image/jpeg',data:b64}}]}],
    generationConfig:{temperature:.2,responseMimeType:'application/json',responseSchema:SCAN_SCHEMA}});
  if(my!==scanSeq.n)return;
  const items=parseScanItems(geminiText(data));
  if(!items.length){
    showScanFail("Couldn't find any food in this photo. Try getting the food in frame, in good light.");
    return;
  }
  showScanReview('ai',items);
}
function parseScanItems(text){
  let arr;
  try{arr=JSON.parse(text);}catch(e){
    const a=text.indexOf('['),b=text.lastIndexOf(']');
    if(a<0||b<=a)return[];
    try{arr=JSON.parse(text.slice(a,b+1));}catch(e2){return[];}
  }
  if(!Array.isArray(arr))return[];
  const num=v=>{const n=parseFloat(v);return isFinite(n)&&n>=0?n:0;};
  return arr.slice(0,6).map(o=>({
    name:String((o&&o.name)||'').trim().slice(0,48)||'Food',
    grams:Math.round(clamp(num(o.grams)||100,1,5000)),
    k100:+clamp(num(o.kcal_per_100g),0,1000).toFixed(1),
    p100:+clamp(num(o.protein_per_100g),0,100).toFixed(1),
    c100:+clamp(num(o.carbs_per_100g),0,100).toFixed(1),
    f100:+clamp(num(o.fat_per_100g),0,100).toFixed(1),
    conf:['high','medium','low'].includes(o&&o.confidence)?o.confidence:null,
    serving:null
  }));
}

    `<button class="chip ${addCtx.cat===c?'on':''}" data-act="add-chip" data-v="${esc(c)}">${c}</button>`).join('');
}
function foodRowSheet(f){
  return`<button class="frowwrap" style="border:none;background:none;border-top:1px solid var(--line);width:100%;text-align:left" data-act="food-detail" data-id="${esc(f.id)}">
    <span class="info" style="flex:1;min-width:0"><span class="fname">${esc(f.n)}</span>
    <span class="fmeta">${f.k} kcal / 100 g${f.sg?` · ${esc(f.s)} ≈ ${Math.round(f.k*f.sg/100)} kcal`:''}${f.custom?' · custom':''}</span></span>
    ${ic('chevR',15)}</button>`;
}
function renderAddList(){
  const el=$('#addList');if(!el)return;
  const q=addCtx.q,cat=addCtx.cat;
  let html='';
  if(!q&&cat==='All'){
    const rec=state.recents.map(getFood).filter(Boolean).slice(0,8);
    if(rec.length)html+=`<p class="list-title">Recent</p>`+rec.map(foodRowSheet).join('');
  }
  const items=foodSearchItems(q,cat).slice(0,80);
  if(items.length)html+=`<p class="list-title">${q||cat!=='All'?items.length+' results':'All foods'}</p>`
    +items.map(foodRowSheet).join('');

function gotoDetail(food,instant=false){
  addCtx.food=food;addCtx.grams=food.sg||100;
  renderDetail();setPane(1,instant);
}
function renderDetail(){
  const f=addCtx.food;
  if(!f){$('#dTitle').textContent='Food';$('#dBody').innerHTML='';return;}
  $('#dTitle').textContent=f.n;
  $('#dBody').innerHTML=`
  <div class="dcat eyebrow">${esc(f.cat)} · ${f.k} KCAL / 100 G</div>
  <div class="dcard"><span class="eyebrow">AMOUNT</span>
    <div class="amtc">
      <button class="stp" data-act="amt-minus" aria-label="Less">${ic('minus',16)}</button>
      <input id="amtIn" class="amtin" type="number" inputmode="decimal">
      <button class="stp" data-act="amt-plus" aria-label="More">${ic('plus',16)}</button>
      <button class="unitc" data-act="unit-toggle"></button>
    </div>
    ${f.sg?`<div class="schips" id="sChips">
      <button class="chip" data-act="serving" data-g="${f.sg}">${esc(f.s)}</button>
      <button class="chip" data-act="serving" data-g="100">100 g</button></div>`:''}
  </div>
  <div class="dlive">
    <div class="dk"><span id="dK">0</span><em>KCAL</em></div>
    <div class="dm">
      <div><span class="mp">P</span><b id="dP">0</b><em>G</em></div>
      <div><span class="mc">C</span><b id="dC">0</b><em>G</em></div>
      <div><span class="mf">F</span><b id="dF">0</b><em>G</em></div>
    </div>
  </div>
  <div class="field" style="margin-top:14px"><span class="eyebrow">MEAL</span>
    <div class="seg" id="mealSeg">${MEALS.map(m=>
      `<button data-act="meal-pick" data-m="${m.k}" class="${addCtx.meal===m.k?'on':''}">${m.label}</button>`).join('')}</div></div>
  <button class="btn primary" id="addBtn" data-act="add-confirm" style="margin-top:16px"></button>`;
  $('#amtIn').addEventListener('input',onAmtInput);
  paintDetail();
}
function paintDetail(setInput=true){
  const f=addCtx.food;if(!f||!$('#dK'))return;
  const g=addCtx.grams,k=Math.round(f.k*g/100);
  $('#dK').textContent=fmt(k);
  $('#dP').textContent=f1(f.p*g/100);
  $('#dC').textContent=f1(f.cb*g/100);
  $('#dF').textContent=f1(f.f*g/100);
  if(setInput){const el=$('#amtIn');if(el)el.value=
    addCtx.unit==='g'?Math.round(g):(g/28.3495).toFixed(1);}
  const uc=$('.pane:nth-child(2) .unitc');if(uc)uc.textContent=addCtx.unit;
  document.querySelectorAll('#sChips .chip').forEach(c=>c.classList.toggle('on',+c.dataset.g===Math.round(g)));
  document.querySelectorAll('#mealSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===addCtx.meal));
  $('#addBtn').textContent=`Add to ${MEALS.find(m=>m.k===addCtx.meal).label} · ${fmt(k)} kcal`;
}
function onAmtInput(e){
  const v=parseFloat(e.target.value);
  if(isNaN(v)||v<=0){paintDetail(false);return;}
  addCtx.grams=clamp(addCtx.unit==='g'?v:v*28.3495,1,5000);
  paintDetail(false);
}
function stepAmt(d){
  const st=addCtx.unit==='g'?10:14.175;
  addCtx.grams=clamp(Math.round((addCtx.grams+d*st)*10)/10,1,5000);
  paintDetail();buzz(5);
}
function commitAdd(){
  const f=addCtx.food,g=addCtx.grams;
  const k=Math.round(f.k*g/100);
  day(sel)[addCtx.meal].push({fid:f.id,n:f.n,g,per100:{k:f.k,p:f.p,cb:f.cb,f:f.f}});
  state.recents=[f.id,...state.recents.filter(x=>x!==f.id)].slice(0,14);
  save();closeSheet();buzz(14);
  toast(`Added ${esc(f.n)} · ${fmt(k)} kcal`);
  renderTab();
}
function renderCustomForm(editFood){
  const t=$('#cfTitle'),b=$('#cfBody');if(!t||!b)return;
  t.textContent=editFood?'Edit food':'New custom food';
  const v=editFood||{n:'',k:'',p:'',cb:'',f:'',s:'',sg:''};

  <div class="field" style="margin-bottom:12px"><span class="eyebrow">NAME</span>
    <input id="cfName" class="inp" placeholder="e.g. Grandma's lasagna" value="${esc(v.n)}" maxlength="48"></div>
  <div class="fields">
    <label class="field"><span class="eyebrow">KCAL / 100 G</span><input id="cfK" class="inp" type="number" inputmode="decimal" placeholder="0" value="${v.k}"></label>
    <label class="field"><span class="eyebrow">PROTEIN G</span><input id="cfP" class="inp" type="number" inputmode="decimal" placeholder="0" value="${v.p}"></label>
    <label class="field"><span class="eyebrow">CARBS G</span><input id="cfC" class="inp" type="number" inputmode="decimal" placeholder="0" value="${v.cb}"></label>
    <label class="field"><span class="eyebrow">FAT G</span><input id="cfF" class="inp" type="number" inputmode="decimal" placeholder="0" value="${v.f}"></label>
  </div>
  <div class="fields" style="margin-top:12px">
    <label class="field"><span class="eyebrow">SERVING NAME</span><input id="cfS" class="inp" placeholder="e.g. 1 slice" value="${esc(v.s)}"></label>
    <label class="field"><span class="eyebrow">SERVING GRAMS</span><input id="cfSg" class="inp" type="number" inputmode="decimal" placeholder="0" value="${v.sg||''}"></label>
  </div>
  <button class="btn primary" data-act="custom-save" style="margin-top:16px">${editFood?'Save changes':'Save food'}</button>`;
}
function customSave(){
  const name=$('#cfName').value.trim();
  if(!name){toast('Give your food a name');return;}
  const k=parseFloat($('#cfK').value);
  if(isNaN(k)||k<0){toast('Enter calories per 100 g');return;}
  const num=(id)=>{const n=parseFloat($(id).value);return isNaN(n)||n<0?0:n;};
  const s=$('#cfS').value.trim(),sg=parseFloat($('#cfSg').value);
  const hasS=s&&sg>0;
  let food;
  if(addCtx&&addCtx.editFood){
    food=addCtx.editFood;
    Object.assign(food,{n:name,k,p:num('#cfP'),cb:num('#cfC'),f:num('#cfF'),s:hasS?s:'',sg:hasS?sg:0});
  }else{
    food={id:'c'+Date.now().toString(36),n:name,cat:'My foods',k,
      p:num('#cfP'),cb:num('#cfC'),f:num('#cfF'),s:hasS?s:'',sg:hasS?sg:0,custom:true};
    state.customs.unshift(food);
  }
  save();buzz(10);toast(`Saved ${esc(name)}`);
  gotoDetail(food);
}
function removeEntry(k,m,i){
  const d=state.days[k];if(!d||!d[m]||!d[m][i])return;
  const[e]=d[m].splice(i,1);
  save();buzz(10);renderTab();
  toast(`Removed ${esc(e.n)}`,{label:'Undo',fn:()=>{
    const dd=day(k);dd[m].splice(Math.min(i,dd[m].length),0,e);save();renderTab();}});
}
function openEditSheet(k,m,i){
  const d=state.days[k],e=d&&d[m]&&d[m][i];if(!e)return;
  editCtx={k,m,i,grams:e.g,meal:m,unit:state.units==='imperial'?'oz':'g'};
  openSheet(`<div class="handle-area"><div class="sheet-handle"></div></div>
  <div class="sm-body">
    <div class="shead" style="padding:6px 0 12px"><h3>${esc(e.n)}</h3>
      <button class="xbtn" data-act="sheet-close" aria-label="Close">${ic('x',18)}</button></div>
    <div class="dcard"><span class="eyebrow">AMOUNT</span>
      <div class="amtc">
        <button class="stp" data-act="e-minus" aria-label="Less">${ic('minus',16)}</button>
        <input id="eAmt" class="amtin" type="number" inputmode="decimal">
        <button class="stp" data-act="e-plus" aria-label="More">${ic('plus',16)}</button>
        <button class="unitc" data-act="e-unit"></button>
      </div></div>
    <div class="elive" id="eLive"></div>
    <div class="field" style="margin-top:12px"><span class="eyebrow">MEAL</span>
      <div class="seg" id="eSeg">${MEALS.map(mm=>
        `<button data-act="e-meal" data-m="${mm.k}" class="${editCtx.meal===mm.k?'on':''}">${mm.label}</button>`).join('')}</div></div>
    <button class="btn primary" data-act="e-save" style="margin-top:16px">Save changes</button>
    <button class="btn danger" data-act="e-del" style="margin-top:10px">Remove entry</button>
  </div>`,'sm');
  $('#eAmt').addEventListener('input',ev=>{
    const v=parseFloat(ev.target.value);
    if(!isNaN(v)&&v>0){editCtx.grams=clamp(editCtx.unit==='g'?v:v*28.3495,1,5000);paintEdit(false);}});
  paintEdit();
}
function paintEdit(setInput=true){
  const e=state.days[editCtx.k]&&state.days[editCtx.k][editCtx.m]&&state.days[editCtx.k][editCtx.m][editCtx.i];
  if(!e||!$('#eLive'))return;
  const g=editCtx.grams,per=e.per100,k=Math.round(per.k*g/100);
  if(setInput){const el=$('#eAmt');if(el)el.value=
    editCtx.unit==='g'?Math.round(g):(g/28.3495).toFixed(1);}
  const uc=$('.sm-body .unitc');if(uc)uc.textContent=editCtx.unit;
  $('#eLive').innerHTML=`<b>${fmt(k)} kcal</b>
    <span><span class="mp">P</span> ${f1(per.p*g/100)}</span>
    <span><span class="mc">C</span> ${f1(cOf(per)*g/100)}</span>
    <span><span class="mf">F</span> ${f1(per.f*g/100)}</span>`;
  document.querySelectorAll('#eSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===editCtx.meal));
}
function saveEditEntry(){
  const d=state.days[editCtx.k];const e=d&&d[editCtx.m]&&d[editCtx.m][editCtx.i];if(!e)return;
  e.g=editCtx.grams;
  if(editCtx.meal!==editCtx.m){
    const[mv]=d[editCtx.m].splice(editCtx.i,1);
    day(editCtx.k)[editCtx.meal].push(mv);
  }
  save();closeSheet();buzz(8);renderTab();toast('Entry updated');
}

/* ---------- PWA: generated icon, manifest, install prompt ---------- */
function makeIcon(size){
  const cv=document.createElement('canvas');cv.width=cv.height=size;
  const g=cv.getContext('2d');
  g.fillStyle='#F5EFE3';g.fillRect(0,0,size,size);
  const c=size/2,r=size*.30,w=size*.155;
  g.lineWidth=w;g.lineCap='butt';
  [[4,116,'#E0481C'],[124,236,'#EFA63C'],[244,356,'#7E8F4C']].forEach(([a0,a1,col])=>{
    g.beginPath();g.strokeStyle=col;
    g.arc(c,c,r,(a0-90)*Math.PI/180,(a1-90)*Math.PI/180);g.stroke();});
  return cv.toDataURL('image/png');
}
function setupPWA(){
  try{
    const i192=makeIcon(192),i512=makeIcon(512);
    const man={name:'Morsel — Calorie & Macro Journal',short_name:'Morsel',
      description:'A private daily journal for calories and macros. Everything stays on your device.',
      start_url:location.href,display:'standalone',orientation:'portrait',
      background_color:'#F5EFE3',theme_color:'#F5EFE3',
      icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any'},
             {src:i512,sizes:'512x512',type:'image/png',purpose:'any'},
             {src:i512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
    const l=document.createElement('link');l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
    const f=document.createElement('link');f.rel='icon';f.href=i192;document.head.appendChild(f);
    const a=document.createElement('link');a.rel='apple-touch-icon';a.href=i192;document.head.appendChild(a);
  }catch(e){}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;renderTab();});
  window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('Morsel installed');renderTab();});
}
async function promptInstall(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  const res=await deferredPrompt.userChoice;
  deferredPrompt=null;
  if(res.outcome==='accepted')toast('Installing Morsel…');
  renderTab();
}

/* ---------- global actions ---------- */

  'tab':el=>setTab(el.dataset.tab),

  'scan':()=>{const f=$('#scanFile');if(f)f.click();},
  'add-meal':el=>openAddSheet(el.dataset.meal),

  'day-today':()=>selectDay(todayKey()),

  'week-day':el=>selectDay(el.dataset.key),

  'entry-del':el=>removeEntry(el.dataset.k,el.dataset.m,+el.dataset.i),

  'preset':el=>{const p=PRESETS[el.dataset.v];if(p){state.macros={...p};save();buzz(6);updatePlanResults();}},
  'add-chip':el=>{addCtx.cat=el.dataset.v;buildAddChips();renderAddList();},
  'f-chip':el=>{foodCat=el.dataset.v;updateFoodsList();},
  'food-detail':el=>{const f=getFood(el.dataset.id);if(f)gotoDetail(f);},
  'food-add':el=>{const f=getFood(el.dataset.id);if(f)openAddSheet(defaultMeal(),f);},
  'new-custom':()=>{renderCustomForm(null);setPane(2);},
  'custom-new':()=>openAddSheet(defaultMeal(),null,2),
  'custom-edit':el=>{const f=getFood(el.dataset.id);if(f)openAddSheet(defaultMeal(),null,2,f);},
  'custom-del':el=>{
    const i=state.customs.findIndex(f=>f.id===el.dataset.id);if(i<0)return;
    const[f]=state.customs.splice(i,1);
    state.recents=state.recents.filter(r=>r!==f.id);
    save();renderTab();
    toast(`Deleted ${esc(f.n)}`,{label:'Undo',fn:()=>{
      state.customs.splice(Math.min(i,state.customs.length),0,f);save();renderTab();}});},
  'custom-save':()=>customSave(),
  'serving':el=>{addCtx.grams=+el.dataset.g;paintDetail();},
  'amt-minus':()=>stepAmt(-1),'amt-plus':()=>stepAmt(1),
  'unit-toggle':()=>{if(!addCtx)return;addCtx.unit=addCtx.unit==='g'?'oz':'g';paintDetail();},
  'meal-pick':el=>{addCtx.meal=el.dataset.m;paintDetail();},
  'add-confirm':()=>commitAdd(),
  'clear-q':()=>{if(!addCtx)return;addCtx.q='';const s=$('#addSearch');if(s)s.value='';
    const c=$('.clearq');if(c)c.hidden=true;renderAddList();},
  'sex':el=>{state.profile.sex=el.dataset.v;save();renderPlan();},
  'goal':el=>{state.profile.goal=el.dataset.v;save();renderPlan();},
  'theme':el=>{state.theme=el.dataset.v;save();applyTheme();buzz(5);renderTab();},
  'ai-open':()=>openAISettings(),
  'ai-save':()=>{
    const el=$('#aiKeyIn');if(!el)return;
    const v=el.value.trim();
    if(!v){toast('Paste your API key first');return;}
    state.geminiKey=v;aiReplace=false;save();paintAISettings();
    toast('Key saved — testing…');
    testGemini();},
  'ai-test':()=>testGemini(),
  'ai-replace':()=>{aiReplace=true;paintAISettings();},
  'ai-remove':()=>{state.geminiKey='';aiReplace=false;save();paintAISettings();toast('API key removed');},
  'scan-amt':el=>{
    if(!scanCtx)return;const it=scanCtx.items[+el.dataset.i];if(!it)return;
    it.grams=clamp(Math.round(it.grams+10*(+el.dataset.d)),1,5000);
    const inp=document.querySelector(`.scan-g[data-i="${el.dataset.i}"]`);
    if(inp)inp.value=it.grams;
    paintScanLive();buzz(5);},
  'scan-serving':el=>{
    if(!scanCtx)return;const it=scanCtx.items[+el.dataset.i];if(!it)return;

    const inp=document.querySelector(`.scan-g[data-i="${el.dataset.i}"]`);
    if(inp)inp.value=it.grams;
    paintScanLive();},
  'scan-item-del':el=>{
    if(!scanCtx)return;
    scanCtx.items.splice(+el.dataset.i,1);
    if(!scanCtx.items.length){closeSheet();toast('Scan discarded');return;}
    rebuildScanReview();},
  'scan-meal':el=>{
    if(!scanCtx)return;scanCtx.meal=el.dataset.m;
    document.querySelectorAll('#scanMealSeg button').forEach(b=>
      b.classList.toggle('on',b.dataset.m===scanCtx.meal));},
  'scan-add-all':()=>commitScan(),
  'scanhint-dismiss':()=>{state.scanHintDismissed=true;save();renderTab();},
  'install':()=>promptInstall(),
  'install-dismiss':()=>{state.installDismissed=true;save();renderTab();},
  'onboard-setup':()=>{state.onboarded=true;save();setTab('plan');},
  'onboard-later':()=>{state.onboarded=true;save();renderTab();},
  'export':()=>doExport(),
  'import-open':()=>{const fi=$('#importFile');if(fi)fi.click();},
  'erase-open':()=>openEraseSheet(),
  'erase-confirm':()=>doErase(),
  'units':el=>{state.units=el.dataset.v;save();renderTab();},
  'wg-minus':()=>{state.waterGoal=Math.max(1,state.waterGoal-1);save();renderTab();},
  'wg-plus':()=>{state.waterGoal=Math.min(16,state.waterGoal+1);save();renderTab();},
  'e-minus':()=>{if(!editCtx)return;const st=editCtx.unit==='g'?10:14.175;
    editCtx.grams=clamp(Math.round((editCtx.grams-st)*10)/10,1,5000);paintEdit();},
  'e-plus':()=>{if(!editCtx)return;const st=editCtx.unit==='g'?10:14.175;
    editCtx.grams=clamp(Math.round((editCtx.grams+st)*10)/10,1,5000);paintEdit();},
  'e-unit':()=>{if(!editCtx)return;editCtx.unit=editCtx.unit==='g'?'oz':'g';paintEdit();},
  'e-meal':el=>{editCtx.meal=el.dataset.m;paintEdit();},
  'e-save':()=>saveEditEntry(),
  'e-del':()=>{const c={...editCtx};closeSheet();removeEntry(c.k,c.m,c.i);}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACTIONS[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

/* ---------- boot ---------- */
injectChrome();
applyTheme();
setupPWA();

if(scanInput)scanInput.addEventListener('change',e=>{
